[package]
name = "bsargeom"
version = "1.4.0"
edition = "2024"

# The app lives at the repo root; `xtask` (packaging) and `xtask-win-installer`
# (the embedded Windows .exe installer) are helper crates. `default-members`
# keeps a plain `cargo build`/`cargo run` building ONLY the app — the installer
# crates build on demand via the `cargo xtask` alias (see .cargo/config.toml).
# The app version above stays the single source of truth: xtask reads it from
# this file (see xtask/build.rs), so there is nothing to keep in sync.
[workspace]
members = ["xtask", "xtask-win-installer"]
default-members = ["."]

[dependencies.bevy]
version = "0.20"
default-features = false
# Fine-grained features kept on purpose: the curated collections ("3d", "3d_api",
# "common_api", ...) all pull subsystems this app doesn't use (gltf, picking, scene,
# gamepad, text/fonts, clipboard, animation) and would grow the wasm binary.
# Both Linux windowing backends are enabled: winit picks Wayland when a compositor
# is present and falls back to X11 otherwise, so a single binary is sharp on
# HiDPI Wayland sessions instead of going through XWayland. `winit/wayland` uses
# the pure-Rust wayland stack, so this adds no system library to build or run
# (cost measured on this crate: +1.6 MiB, +3.1% of the release binary).
# `pan_orbit_camera` is Bevy's built-in camera controller. It compiles
# `bevy_picking` for its system ordering, but the app adds no picking plugin:
# src/camera feeds the controller mouse and touch input directly (`touch`
# provides the finger state it reads).
features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_winit",
    "bevy_window",
    "multi_threaded",
    "tonemapping_luts",
    "sysinfo_plugin",
    "mouse",
    "keyboard",
    "webgpu",
    "x11",
    "wayland",
    "pan_orbit_camera",
    "touch",
]

[dependencies]
# 0.43.1 at least: 0.43.0's egui shader is broken on the web (Wasm).
# Only the features the app uses: rendering, egui's bundled fonts and the system
# clipboard (copy/paste in text fields). The defaults would also build bevy_ui
# and its renderer, the bevy_picking integration and `webbrowser` (to open
# links), none of which the app uses (saving measured on this crate: -5.4 MiB,
# -9.7% of the release binary; -1.8 MiB, -8.5% of the web build's wasm after
# wasm-opt).
bevy_egui = { version = "0.43.1", default-features = false, features = [
    "render",
    "default_fonts",
    "manage_clipboard",
] }
# note: egui_extras is versioned in lockstep with egui — 0.36 matches the egui
# 0.36 that bevy_egui 0.43 links against. A mismatch puts a second egui in the
# dependency tree (the same trap as the egui_plot/egui-file-dialog pins below).
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
# note: egui_plot's version is offset from egui's — 0.37 is the release built
# against egui 0.36. Using 0.36 (egui 0.35), or a later release built for a
# newer egui, silently duplicates egui in the tree, like the egui_extras
# mismatch described above.
egui_plot = "0.37"
png = "0.18"

# Native-only: the in-app "save as" dialog. Its version is offset from egui's —
# 0.15 is the release built against egui 0.36; 0.14 pulls egui 0.35, and a
# later release built for a newer egui would likewise silently duplicate egui
# in the tree (the same trap as the egui_extras/egui_plot pins above).
#
# `winit` is used only to set the window icon at runtime (see src/main.rs). It is
# pinned to the same 0.30 line bevy_winit links against so cargo unifies them to
# a single crate — a mismatch would put two winit versions in the tree and the
# `WINIT_WINDOWS` handle type would no longer match `winit::window::Icon`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-file-dialog = "0.15"
winit = "0.30"

# Web-only: the browser has no filesystem, so saving an image goes through a
# Blob + download link (see src/download.rs). Native builds pull none of this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Document",
    "Window",
    "HtmlAnchorElement",
    "Element",
    "HtmlElement"
] }

# Windows-only: embed the application icon (and version info) into bsargeom.exe
# so it shows in Explorer and the taskbar. `build.rs` no-ops on other targets.
[build-dependencies]
embed-resource = "3"

# Size optimization (see: https://github.com/johnthagen/min-sized-rust)
[profile.release]
strip = true # = "symbols" Automatically strip symbols from the binary.
lto = true
codegen-units = 1

[profile.web-release]
inherits = "release"
strip = false # = "none" Do not strip symbols from the binary.
opt-level = "z"
